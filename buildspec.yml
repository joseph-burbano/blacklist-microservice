version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python -m pip install -r requirements.txt -r requirements-dev.txt
  pre_build:
    commands:
      - test -n "$IMAGE_REPOSITORY_URI"
      - test -n "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - export IMAGE_TAG=$(printf '%s' "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-12)
      - export IMAGE_URI="$IMAGE_REPOSITORY_URI:$IMAGE_TAG"
  build:
    commands:
      - python -m pytest tests -v --junitxml=reports/junit.xml
      - python scripts/render_ecs_artifacts.py
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${IMAGE_REPOSITORY_URI%%/*}"
      - docker build --tag "$IMAGE_URI" .
      - docker push "$IMAGE_URI"

reports:
  pruebas-unitarias:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
